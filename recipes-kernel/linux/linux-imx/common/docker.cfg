# --------------------------------------------------------------------
# Docker Engine / containerd essentials
# --------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y

CONFIG_CGROUPS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_CGROUP_BPF=y

# cgroup v2 support (recommended for current Docker)
CONFIG_CGROUP_V2=y

# Memory, CPU, I/O and block-device container limits
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_BLK_CGROUP=y
CONFIG_BLK_DEV_THROTTLING=y

# Optional but useful resource controllers
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_HUGETLB=y
CONFIG_NET_CLS_CGROUP=y
CONFIG_CGROUP_NET_PRIO=y

# --------------------------------------------------------------------
# Filesystems / Docker overlay2 image store
# --------------------------------------------------------------------
CONFIG_OVERLAY_FS=y

# Use this when Docker data-root (/var/lib/docker) is ext4.
# EXT4_FS_SECURITY is required for xattrs such as security.capability.
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_EXT4_FS_XATTR=y

# Strongly recommended for /var/lib/docker and container writable layers
CONFIG_FS_POSIX_ACL=y
CONFIG_FS_SECURITY=y
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y

# tmpfs / /dev/shm
CONFIG_TMPFS=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y

# --------------------------------------------------------------------
# Security and syscall filtering
# --------------------------------------------------------------------
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_KEYS=y
CONFIG_SECURITY_APPARMOR=y
# Enable only if your distro/userspace is configured for SELinux:
# CONFIG_SECURITY_SELINUX=y

# --------------------------------------------------------------------
# Network stack required by Docker bridge/NAT networking
# --------------------------------------------------------------------
CONFIG_INET=y
CONFIG_IPV6=y
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y

CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_VETH=y
CONFIG_TUN=y

CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y
CONFIG_NF_TABLES=y
CONFIG_NFT_CT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y
CONFIG_NFT_FIB=y
CONFIG_NFT_FIB_IPV4=y
CONFIG_NFT_FIB_IPV6=y

# iptables compatibility and Docker bridge networking
CONFIG_NETFILTER_XTABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y

CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_IP_NF_TARGET_REDIRECT=y
CONFIG_IP_NF_RAW=y

CONFIG_IP6_NF_IPTABLES=y
CONFIG_IP6_NF_FILTER=y
CONFIG_IP6_NF_MANGLE=y
CONFIG_IP6_NF_NAT=y
CONFIG_IP6_NF_RAW=y

# Docker overlay-network support, if needed
CONFIG_VXLAN=y
CONFIG_BRIDGE_VLAN_FILTERING=y

# Optional Docker network drivers
CONFIG_MACVLAN=y
CONFIG_IPVLAN=y
CONFIG_DUMMY=y

# Helpful for FTP/TFTP from containers
CONFIG_NF_CONNTRACK_FTP=y
CONFIG_NF_NAT_FTP=y
CONFIG_NF_CONNTRACK_TFTP=y
CONFIG_NF_NAT_TFTP=y

# --------------------------------------------------------------------
# Pseudo-filesystems and device handling
# --------------------------------------------------------------------
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_DEVPTS_FS=y
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
CONFIG_POSIX_MQUEUE=y
CONFIG_EVENTFD=y
CONFIG_EPOLL=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
